<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGC Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --panel: #fafafa;
            --border: #e5e5e5;
            --text: #1a1a1a;
            --muted: #777777;
            --muted-2: #aaaaaa;
            --accent: #1a1a1a;
            --done: #b8b8b8;
            --danger: #b94a4a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Newsreader', serif;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
        }
        body { padding: 40px 32px 80px; max-width: 1200px; margin: 0 auto; }

        header.page-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 18px;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        header.page-header h1 {
            font-weight: 300;
            font-size: 1.9rem;
            letter-spacing: 0.04em;
        }
        header.page-header .meta {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.05em;
            display: flex;
            gap: 14px;
            align-items: center;
        }
        header.page-header .meta button {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: inherit;
            font-size: 0.78rem;
            padding: 5px 12px;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: color .2s, border-color .2s;
        }
        header.page-header .meta button:hover { color: var(--text); border-color: var(--text); }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 36px;
        }
        @media (max-width: 760px) {
            .grid { grid-template-columns: 1fr; gap: 20px; }
            body { padding: 24px 16px 60px; }
        }

        section.card {
            border: 1px solid var(--border);
            background: var(--panel);
            padding: 20px 22px 18px;
        }
        section.card h2 {
            font-weight: 400;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        section.card h2 .count {
            font-size: 0.75rem;
            color: var(--muted-2);
            font-weight: 300;
        }

        .item-list { list-style: none; }
        .item-list li {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px dashed transparent;
        }
        .item-list li:not(:last-child) { border-bottom-color: #ececec; }
        .item-list li.done .item-text { color: var(--done); text-decoration: line-through; }
        .item-list input[type=checkbox] {
            margin-top: 6px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .item-text {
            flex: 1;
            font-size: 0.98rem;
            line-height: 1.45;
            border: none;
            background: transparent;
            font-family: inherit;
            color: inherit;
            outline: none;
            padding: 2px 0;
        }
        .item-text:focus { border-bottom: 1px solid var(--border); }
        .item-date {
            font-size: 0.78rem;
            color: var(--muted);
            font-family: inherit;
            border: none;
            background: transparent;
            padding: 4px 2px;
            outline: none;
            min-width: 110px;
        }
        .item-date:focus { color: var(--text); }
        .item-del {
            background: none;
            border: none;
            color: var(--muted-2);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 6px;
            line-height: 1;
        }
        .item-del:hover { color: var(--danger); }

        .add-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .add-row input[type=text] {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            outline: none;
            padding: 4px 0;
        }
        .add-row input[type=text]::placeholder { color: var(--muted-2); font-style: italic; }
        .add-row input[type=date] {
            border: none;
            background: transparent;
            font-family: inherit;
            color: var(--muted);
            font-size: 0.82rem;
            outline: none;
        }
        .add-row button {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: inherit;
            font-size: 0.85rem;
            padding: 4px 12px;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: color .2s, border-color .2s;
        }
        .add-row button:hover { color: var(--text); border-color: var(--text); }

        /* Projects */
        .projects-wrap {
            border: 1px solid var(--border);
            background: var(--panel);
            padding: 20px 22px;
        }
        .projects-wrap > h2 {
            font-weight: 400;
            font-size: 1.05rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .project {
            border-top: 1px solid var(--border);
            padding: 14px 0;
        }
        .project-head {
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            user-select: none;
        }
        .project-head .chev {
            color: var(--muted-2);
            font-size: 0.9rem;
            width: 12px;
            display: inline-block;
            transition: transform .15s;
        }
        .project.open .chev { transform: rotate(90deg); }
        .project-name {
            font-size: 1.05rem;
            font-weight: 400;
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            color: var(--text);
            outline: none;
        }
        .project-status {
            font-family: inherit;
            font-size: 0.78rem;
            color: var(--muted);
            border: 1px solid var(--border);
            background: var(--bg);
            padding: 3px 8px;
            letter-spacing: 0.05em;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted-2);
        }
        .status-active .status-dot { background: #4a8a4a; }
        .status-planning .status-dot { background: #c89b3c; }
        .status-onhold .status-dot { background: #999; }
        .status-complete .status-dot { background: #4a6a8a; }

        .project-body {
            display: none;
            margin-top: 14px;
            padding-left: 26px;
        }
        .project.open .project-body { display: block; }
        .project-notes {
            width: 100%;
            min-height: 60px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 8px 10px;
            resize: vertical;
            color: var(--text);
            outline: none;
            margin-bottom: 12px;
        }
        .project-notes:focus { border-color: var(--text); }
        .project-sub h3 {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted-2);
            margin: 10px 0 6px;
        }

        .new-project-row {
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            margin-top: 4px;
        }
        .new-project-row input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            padding: 4px 0;
        }
        .new-project-row input::placeholder { color: var(--muted-2); font-style: italic; }
        .new-project-row button {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: inherit;
            font-size: 0.85rem;
            padding: 4px 12px;
            cursor: pointer;
            letter-spacing: 0.05em;
        }
        .new-project-row button:hover { color: var(--text); border-color: var(--text); }

        .save-status {
            font-size: 0.72rem;
            color: var(--muted-2);
            letter-spacing: 0.05em;
            min-width: 50px;
        }
        .save-status.saved { color: #4a8a4a; }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>NGC Dashboard</h1>
        <div class="meta">
            <span class="save-status" id="save-status">&nbsp;</span>
            <button id="export-btn" title="Download a JSON backup">Export</button>
            <button id="import-btn" title="Restore from a JSON backup">Import</button>
            <input type="file" id="import-file" accept="application/json" style="display:none">
        </div>
    </header>

    <div class="grid">
        <section class="card" data-list="immediate">
            <h2>Immediate Actions <span class="count"></span></h2>
            <ul class="item-list"></ul>
            <div class="add-row">
                <input type="text" placeholder="Add an immediate action…">
                <input type="date">
                <button>Add</button>
            </div>
        </section>

        <section class="card" data-list="todos">
            <h2>To-Dos <span class="count"></span></h2>
            <ul class="item-list"></ul>
            <div class="add-row">
                <input type="text" placeholder="Add a to-do…">
                <input type="date">
                <button>Add</button>
            </div>
        </section>

        <section class="card" data-list="meetings">
            <h2>Meetings <span class="count"></span></h2>
            <ul class="item-list"></ul>
            <div class="add-row">
                <input type="text" placeholder="Meeting (who / topic)…">
                <input type="date">
                <button>Add</button>
            </div>
        </section>

        <section class="card" data-list="visits-upcoming">
            <h2>Upcoming Visits <span class="count"></span></h2>
            <ul class="item-list"></ul>
            <div class="add-row">
                <input type="text" placeholder="Site visit…">
                <input type="date">
                <button>Add</button>
            </div>
        </section>

        <section class="card" data-list="visits-toplan">
            <h2>Visits to Plan <span class="count"></span></h2>
            <ul class="item-list"></ul>
            <div class="add-row">
                <input type="text" placeholder="Visit needing scheduling…">
                <input type="date">
                <button>Add</button>
            </div>
        </section>

        <section class="card" data-list="completed">
            <h2>Recently Completed <span class="count"></span></h2>
            <ul class="item-list"></ul>
            <div class="add-row">
                <input type="text" placeholder="Mark something complete…">
                <input type="date">
                <button>Add</button>
            </div>
        </section>
    </div>

    <div class="projects-wrap">
        <h2>Projects <span class="count" id="proj-count"></span></h2>
        <div id="projects-list"></div>
        <div class="new-project-row">
            <input type="text" id="new-project" placeholder="Add a project…">
            <button id="add-project">Add</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "ngc-dashboard-v1";

        const SEED_PROJECTS = [
            "Bass Rocks",
            "Bergen County",
            "Fairmount Country Club",
            "Fall River",
            "Haverhill",
            "Madison Golf Club",
            "Mendham",
            "Met Links",
            "Soldier Hill",
            "Valley Brook"
        ].map(name => ({
            id: makeId(), name, status: "active", notes: "", open: false, tasks: []
        }));

        const DEFAULT_STATE = {
            immediate: [],
            todos: [],
            meetings: [],
            "visits-upcoming": [],
            "visits-toplan": [],
            completed: [],
            projects: SEED_PROJECTS
        };

        let state = load();

        function makeId() {
            return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
        }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
                const parsed = JSON.parse(raw);
                return Object.assign({}, DEFAULT_STATE, parsed);
            } catch {
                return JSON.parse(JSON.stringify(DEFAULT_STATE));
            }
        }

        let saveTimer = null;
        function save() {
            const el = document.getElementById("save-status");
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                    el.textContent = "saved";
                    el.className = "save-status saved";
                    setTimeout(() => { el.textContent = ""; el.className = "save-status"; }, 1000);
                } catch (e) {
                    el.textContent = "save failed";
                }
            }, 250);
        }

        function render() {
            renderLists();
            renderProjects();
        }

        function renderLists() {
            document.querySelectorAll("section.card").forEach(section => {
                const key = section.dataset.list;
                const items = state[key] || [];
                const ul = section.querySelector(".item-list");
                ul.innerHTML = "";
                items.forEach(item => ul.appendChild(renderItem(key, item)));
                section.querySelector("h2 .count").textContent = items.length ? items.length : "";
            });
        }

        function renderItem(listKey, item) {
            const li = document.createElement("li");
            if (item.done) li.classList.add("done");

            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = !!item.done;
            cb.addEventListener("change", () => { item.done = cb.checked; save(); render(); });

            const text = document.createElement("input");
            text.type = "text";
            text.className = "item-text";
            text.value = item.text || "";
            text.addEventListener("input", () => { item.text = text.value; save(); });

            const date = document.createElement("input");
            date.type = "date";
            date.className = "item-date";
            date.value = item.date || "";
            date.addEventListener("change", () => { item.date = date.value; save(); });

            const del = document.createElement("button");
            del.className = "item-del";
            del.textContent = "×";
            del.title = "Delete";
            del.addEventListener("click", () => {
                state[listKey] = state[listKey].filter(i => i.id !== item.id);
                save(); render();
            });

            li.append(cb, text, date, del);
            return li;
        }

        const STATUS_CYCLE = ["active", "planning", "onhold", "complete"];
        const STATUS_LABEL = { active: "Active", planning: "Planning", onhold: "On hold", complete: "Complete" };

        function renderProjects() {
            const wrap = document.getElementById("projects-list");
            wrap.innerHTML = "";
            (state.projects || []).forEach(p => wrap.appendChild(renderProject(p)));
            document.getElementById("proj-count").textContent = (state.projects || []).length || "";
        }

        function renderProject(p) {
            const wrap = document.createElement("div");
            wrap.className = "project status-" + (p.status || "active");
            if (p.open) wrap.classList.add("open");

            const head = document.createElement("div");
            head.className = "project-head";

            const chev = document.createElement("span");
            chev.className = "chev";
            chev.textContent = "▶";

            const name = document.createElement("input");
            name.className = "project-name";
            name.value = p.name || "";
            name.addEventListener("input", () => { p.name = name.value; save(); });
            name.addEventListener("click", e => e.stopPropagation());

            const status = document.createElement("button");
            status.className = "project-status";
            status.innerHTML = '<span class="status-dot"></span><span>' + (STATUS_LABEL[p.status] || "Active") + '</span>';
            status.addEventListener("click", e => {
                e.stopPropagation();
                const i = STATUS_CYCLE.indexOf(p.status);
                p.status = STATUS_CYCLE[(i + 1) % STATUS_CYCLE.length];
                save(); render();
            });

            const del = document.createElement("button");
            del.className = "item-del";
            del.textContent = "×";
            del.title = "Delete project";
            del.addEventListener("click", e => {
                e.stopPropagation();
                if (!confirm('Delete project "' + p.name + '"?')) return;
                state.projects = state.projects.filter(x => x.id !== p.id);
                save(); render();
            });

            head.append(chev, name, status, del);
            head.addEventListener("click", () => { p.open = !p.open; save(); render(); });

            const body = document.createElement("div");
            body.className = "project-body";

            const notes = document.createElement("textarea");
            notes.className = "project-notes";
            notes.placeholder = "Notes, key contacts, scope…";
            notes.value = p.notes || "";
            notes.addEventListener("input", () => { p.notes = notes.value; save(); });

            const sub = document.createElement("div");
            sub.className = "project-sub";
            const h3 = document.createElement("h3");
            h3.textContent = "Tasks";
            sub.appendChild(h3);

            const ul = document.createElement("ul");
            ul.className = "item-list";
            (p.tasks || []).forEach(t => ul.appendChild(renderProjectTask(p, t)));
            sub.appendChild(ul);

            const addRow = document.createElement("div");
            addRow.className = "add-row";
            const addInput = document.createElement("input");
            addInput.type = "text";
            addInput.placeholder = "Add a task to this project…";
            const addDate = document.createElement("input");
            addDate.type = "date";
            const addBtn = document.createElement("button");
            addBtn.textContent = "Add";
            const doAdd = () => {
                const v = addInput.value.trim();
                if (!v) return;
                p.tasks = p.tasks || [];
                p.tasks.push({ id: makeId(), text: v, date: addDate.value || "", done: false });
                addInput.value = ""; addDate.value = "";
                save(); render();
            };
            addBtn.addEventListener("click", doAdd);
            addInput.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
            addRow.append(addInput, addDate, addBtn);
            sub.appendChild(addRow);

            body.append(notes, sub);
            wrap.append(head, body);
            return wrap;
        }

        function renderProjectTask(p, t) {
            const li = document.createElement("li");
            if (t.done) li.classList.add("done");

            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = !!t.done;
            cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });

            const text = document.createElement("input");
            text.type = "text";
            text.className = "item-text";
            text.value = t.text || "";
            text.addEventListener("input", () => { t.text = text.value; save(); });

            const date = document.createElement("input");
            date.type = "date";
            date.className = "item-date";
            date.value = t.date || "";
            date.addEventListener("change", () => { t.date = date.value; save(); });

            const del = document.createElement("button");
            del.className = "item-del";
            del.textContent = "×";
            del.addEventListener("click", () => {
                p.tasks = (p.tasks || []).filter(x => x.id !== t.id);
                save(); render();
            });

            li.append(cb, text, date, del);
            return li;
        }

        // List card add buttons
        document.querySelectorAll("section.card").forEach(section => {
            const key = section.dataset.list;
            const textIn = section.querySelector(".add-row input[type=text]");
            const dateIn = section.querySelector(".add-row input[type=date]");
            const btn = section.querySelector(".add-row button");
            const doAdd = () => {
                const v = textIn.value.trim();
                if (!v) return;
                state[key] = state[key] || [];
                state[key].push({ id: makeId(), text: v, date: dateIn.value || "", done: false });
                textIn.value = ""; dateIn.value = "";
                save(); render();
            };
            btn.addEventListener("click", doAdd);
            textIn.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
        });

        // Add project
        const newProj = document.getElementById("new-project");
        const doAddProject = () => {
            const v = newProj.value.trim();
            if (!v) return;
            state.projects = state.projects || [];
            state.projects.push({
                id: makeId(), name: v, status: "active", notes: "", open: true, tasks: []
            });
            newProj.value = "";
            save(); render();
        };
        document.getElementById("add-project").addEventListener("click", doAddProject);
        newProj.addEventListener("keydown", e => { if (e.key === "Enter") doAddProject(); });

        // Export / Import (for moving data between browsers or backing up)
        document.getElementById("export-btn").addEventListener("click", () => {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            const stamp = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = "ngc-dashboard-" + stamp + ".json";
            a.click();
            URL.revokeObjectURL(url);
        });
        document.getElementById("import-btn").addEventListener("click", () => {
            document.getElementById("import-file").click();
        });
        document.getElementById("import-file").addEventListener("change", e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);
                    if (!confirm("Replace current dashboard data with the imported file?")) return;
                    state = Object.assign({}, DEFAULT_STATE, data);
                    save(); render();
                } catch {
                    alert("That file doesn't look like a valid dashboard export.");
                }
            };
            reader.readAsText(file);
            e.target.value = "";
        });

        render();
    </script>
</body>
</html>
